# Shallow clones. Feed history is never read by the build, only the working
# tree is, and luci's full history alone is over 400 MiB.
src-git packages https://git.openwrt.org/feed/packages.git
src-git luci https://git.openwrt.org/project/luci.git
src-git routing https://git.openwrt.org/feed/routing.git
src-git telephony https://git.openwrt.org/feed/telephony.git

# The Argon theme and its settings page are deliberately NOT feeds. Both repos
# keep their package Makefile at the repository root, and include/scan.mk cannot
# index that layout: it strips the feed prefix and then expects to find
# "<subdir>/Makefile:", so a root-level Makefile yields a malformed entry and the
# feed index is never written. build.sh clones them into package/extra/ instead.

# OpenClash. The feed root is the repo root; the package lives in the
# luci-app-openclash subdirectory, which scripts/feeds discovers on its own.
src-git openclash https://github.com/vernesong/OpenClash.git

# DDNSTO: the daemon lives in linkease/nas-packages, the LuCI page in
# linkease/nas-packages-luci. Neither repo shadows an official package name.
src-git linkease https://github.com/linkease/nas-packages.git;master
src-git linkease_luci https://github.com/linkease/nas-packages-luci.git;main
