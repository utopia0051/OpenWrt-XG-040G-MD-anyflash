name: Build XG-040G-MD (UBI, any flash size)

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: OpenWrt git ref to build
        required: false
        default: main
      mihomo_version:
        description: mihomo core version to bake into the image
        required: false
        default: v1.19.30
  push:
    branches: [main]
    paths-ignore: ['**.md']

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch set
        uses: actions/checkout@v7
        with:
          path: patchset

      # A default runner has roughly 25 GiB free, and a from-source OpenWrt
      # build with this package set needs about 20. Reclaiming the preinstalled
      # toolchains is the difference between finishing and dying on ENOSPC.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd libelf-dev ecj fastjar \
            java-propose-classpath python3-distutils-extra \
            python3-dev quilt subversion time xsltproc xxd

      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "${{ github.event.inputs.openwrt_ref || 'main' }}"
          git log --oneline -1

      - name: Apply any-flash-size patches
        run: |
          cd openwrt
          patch -p1 --no-backup-if-mismatch \
            < ../patchset/patches/openwrt/001-airoha-xg-040g-ubi-parts-autosize.patch
          cp ../patchset/patches/uboot-airoha/*.patch package/boot/uboot-airoha/patches/
          git --no-pager diff --stat
          ls package/boot/uboot-airoha/patches/

      # The ccache directory is what makes a re-run cheap: without it every run
      # rebuilds the cross toolchain from scratch, which is the single longest
      # part of the build. The key rotates weekly so the cache cannot go stale
      # against a moving OpenWrt main.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-an7581-${{ github.run_id }}
          restore-keys: |
            ccache-an7581-

      - name: Update feeds
        run: |
          cd openwrt
          cp ../patchset/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p openclash luci-app-openclash
          ./scripts/feeds install -p packages ttyd
          ./scripts/feeds install -p luci luci-app-ttyd
          ./scripts/feeds install -p linkease ddnsto
          ./scripts/feeds install -p linkease_luci luci-app-ddnsto

      # Both Argon repos keep their package Makefile at the repository root,
      # which include/scan.mk cannot index, so as feeds they silently produce no
      # packages at all. Under package/ the normal recursive scan finds them.
      - name: Add Argon theme
        run: |
          cd openwrt
          mkdir -p package/extra
          git clone --depth 1 --branch v2.4.6 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/extra/luci-theme-argon
          git clone --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/extra/luci-app-argon-config

      # OpenClash compiles its Chinese catalogue with po2lmo but never declares
      # the host tool that provides it, so the build can race luci-base/host.
      - name: Fix OpenClash host dependency
        run: |
          cd openwrt
          mk=feeds/openclash/luci-app-openclash/Makefile
          grep -q '^PKG_BUILD_DEPENDS' "$mk" || sed -i \
            's|^include \$(INCLUDE_DIR)/package.mk|PKG_BUILD_DEPENDS:=luci-base/host\n\ninclude $(INCLUDE_DIR)/package.mk|' "$mk"
          grep -n 'PKG_BUILD_DEPENDS' "$mk"

      # OpenClash ships no core. files/ is overlaid onto the rootfs verbatim, so
      # the binary lands in the read-only squashfs layer and survives a reset.
      # The path is the meta_core_path from the package's own init script.
      - name: Bake in the mihomo core
        env:
          MIHOMO_VER: ${{ github.event.inputs.mihomo_version || 'v1.19.30' }}
        run: |
          cd openwrt
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/mihomo-linux-arm64-${MIHOMO_VER}.gz"
          curl -fsSL "$url" -o core.gz
          gzip -d core.gz
          install -D -m 0755 core files/etc/openclash/core/clash_meta
          rm -f core
          file files/etc/openclash/core/clash_meta

      - name: Configure
        run: |
          cd openwrt
          cp ../patchset/config.seed .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      # Catching a wrong package name here costs seconds; discovering it after
      # the toolchain builds costs an hour of runner time.
      - name: Verify configuration
        run: |
          cd openwrt
          fatal=0
          while read -r want; do
            [ -n "$want" ] || continue
            grep -qx "$want" .config || { echo "FATAL  $want"; fatal=$((fatal+1)); }
          done <<'EOF'
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_apk-mbedtls=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_KERNEL_DEVMEM=y
          CONFIG_BUSYBOX_CONFIG_DEVMEM=y
          EOF
          [ "$fatal" -eq 0 ] || { echo "$fatal critical symbols missing"; exit 1; }
          echo "all critical config symbols present"

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download
          df -h /

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=sc

      - name: List artifacts
        run: |
          cd openwrt
          ls -lh bin/targets/airoha/an7581/
          sha256sum bin/targets/airoha/an7581/* 2>/dev/null || true
          df -h /

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-xg-040g-md-ubi
          path: |
            openwrt/bin/targets/airoha/an7581/*
            openwrt/.config
          if-no-files-found: error
