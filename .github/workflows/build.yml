name: Build XG-040G-MD (UBI, any flash size)

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: OpenWrt git ref to build
        required: false
        default: main
  push:
    branches: [main]

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch set
        uses: actions/checkout@v4
        with:
          path: patchset

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd libelf-dev ecj fastjar \
            java-propose-classpath libelf-dev python3-distutils-extra \
            python3-dev quilt subversion time xsltproc

      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "${{ github.event.inputs.openwrt_ref || 'main' }}"
          git log --oneline -1

      - name: Apply any-flash-size patches
        run: |
          cd openwrt
          patch -p1 --no-backup-if-mismatch \
            < ../patchset/patches/openwrt/001-airoha-xg-040g-ubi-parts-autosize.patch
          cp ../patchset/patches/uboot-airoha/*.patch package/boot/uboot-airoha/patches/
          git --no-pager diff --stat
          ls package/boot/uboot-airoha/patches/

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp ../patchset/config.seed .config
          make defconfig
          grep -E 'TARGET_(airoha|DEVICE)|xg-040g' .config | head -40

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=sc

      - name: List artifacts
        run: |
          cd openwrt
          ls -lh bin/targets/airoha/an7581/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xg-040g-md-ubi
          path: |
            openwrt/bin/targets/airoha/an7581/*
          if-no-files-found: error
